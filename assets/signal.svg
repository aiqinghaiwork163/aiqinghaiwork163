<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 28" width="1200" height="28" role="img" aria-label="">
  <rect width="1200" height="28" fill="#0B0D10"/>
  <!-- baseline -->
  <line x1="0" y1="14" x2="1200" y2="14" stroke="#2A2E33" stroke-width="1"/>
  <!-- origin tick, breathing -->
  <rect x="0" y="4" width="3" height="20" fill="#FF4D1C">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <!-- traveling ember  launch window -->
  <rect y="13" width="140" height="2" fill="#FF4D1C" opacity="0.95">
    <animate attributeName="x" values="-140;1200" dur="5.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.86;1" dur="5.2s" repeatCount="indefinite"/>
  </rect>
  <!-- secondary ghost pulse -->
  <rect y="13" width="64" height="2" fill="#FFB08A" opacity="0.35">
    <animate attributeName="x" values="-80;1200" dur="5.2s" begin="0.35s" repeatCount="indefinite"/>
  </rect>
  <!-- orbital hash marks -->
  <g fill="#5C6168">
    <rect x="200" y="10" width="1" height="8"/>
    <rect x="400" y="10" width="1" height="8"/>
    <rect x="600" y="10" width="1" height="8"/>
    <rect x="800" y="10" width="1" height="8"/>
    <rect x="1000" y="10" width="1" height="8"/>
  </g>
</svg>
